<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>链接池</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="/site-assets/user_assets/css/backend.css?v=1.3.1346" rel="stylesheet">
<link rel="stylesheet" href="/admin-runtime.css">
</head>
<body class="inside-header inside-aside" data-page-key="link_pool-add" data-page-path="/user/link_pool">
<div class="content"><div class="panel panel-default"><div class="panel-body">
<form class="form-horizontal">
  <div class="form-group"><label class="control-label col-xs-12 col-sm-2">标题</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[title]" required placeholder="链接标题"></div></div>
  <div class="form-group"><label class="control-label col-xs-12 col-sm-2">地址</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[url]" required placeholder="https://"></div></div>
  <div class="form-group"><label class="control-label col-xs-12 col-sm-2">分类</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[category]" placeholder="例如 健康"></div></div>
  <div class="form-group"><label class="control-label col-xs-12 col-sm-2">关键词</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[keywords]" placeholder="用于推荐匹配"></div></div>
  <div class="layer-footer"><button type="submit" class="btn btn-primary">确定</button></div>
</form>
</div></div></div>
<script src="/vendor/jquery.js"></script>
<script src="/vendor/layui.js"></script>
<script src="/geo-api.js"></script>
<script src="/ai-config.js"></script>
<script src="/admin-runtime.js"></script>
</body>
</html>
