<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>知识导入</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<body class="inside-header inside-aside" data-page-key="knowledge_import" data-page-path="/user/knowledge_import">
<div class="content"><div class="panel panel-default"><div class="panel-body">
  <p class="text-muted">单个文件不超过 20 MB，最多导入前 20,000 字。支持 TXT、Markdown、DOCX、PPTX 和带文字层的 PDF。扫描件请先转成可复制文本。</p>
  <div class="form-horizontal">
    <div class="form-group"><label class="control-label col-xs-12 col-sm-2">知识库</label><div class="col-xs-12 col-sm-8"><select class="form-control" name="row[huaxiang_id]" id="import-knowledge"><option value="0">请选择</option></select></div></div>
    <div class="form-group"><label class="control-label col-xs-12 col-sm-2">文件</label><div class="col-xs-12 col-sm-8"><input type="file" id="import-file" accept=".txt,.md,.markdown,.docx,.pptx,.pdf" data-deferred-upload></div></div>
    <div class="form-group"><div class="col-sm-offset-2 col-sm-8"><button type="button" class="btn btn-primary" id="importBtn">导入并重建片段</button></div></div>
  </div>
</div></div></div>
<script src="/vendor/jquery.js"></script>
