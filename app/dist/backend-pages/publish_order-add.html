<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>人工发布</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="/site-assets/user_assets/css/backend.css?v=1.3.1346" rel="stylesheet">

<body class="inside-header inside-aside" data-page-key="publish_order-add" data-page-path="/user/publish_order">
<div class="content"><div class="panel panel-default"><div class="panel-body">
<form class="form-horizontal">
  <div class="form-group"><label class="control-label col-xs-12 col-sm-2">文章</label><div class="col-xs-12 col-sm-8"><select class="form-control" name="row[article_id]" required><option value="">请选择已审核文章</option></select></div></div>
  <div class="form-group"><label class="control-label col-xs-12 col-sm-2">平台</label><div class="col-xs-12 col-sm-8"><select class="form-control" name="row[platform]"><option value="toutiao">头条号</option><option value="sohu">搜狐号</option><option value="netease">网易号</option></select></div></div>
  <div class="form-group"><label class="control-label col-xs-12 col-sm-2">备注</label><div class="col-xs-12 col-sm-8"><textarea class="form-control" name="row[note]" rows="3" placeholder="交给运营的说明"></textarea></div></div>
  <div class="layer-footer"><button type="submit" class="btn btn-primary">确定</button></div>
</form>
</div></div></div>
