<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>专题</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="/site-assets/user_assets/css/backend.css?v=1.3.1346" rel="stylesheet">
<link rel="stylesheet" href="/admin-runtime.css">
</head>
<body class="inside-header inside-aside" data-page-key="topic-add" data-page-path="/user/topic">
<div class="content"><div class="panel panel-default"><div class="panel-body">
<form class="form-horizontal" method="post">
  <div class="form-group"><label class="control-label col-xs-12 col-sm-2">标题</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[title]" required placeholder="专题标题"></div></div>
  <div class="form-group"><label class="control-label col-xs-12 col-sm-2">摘要</label><div class="col-xs-12 col-sm-8"><textarea class="form-control" name="row[summary]" rows="4" placeholder="导读或摘要"></textarea></div></div>
  <div class="form-group"><label class="control-label col-xs-12 col-sm-2">布局</label><div class="col-xs-12 col-sm-8"><select class="form-control" name="row[layout]"><option value="card">标准卡片</option><option value="guide">阅读指南</option><option value="timeline">时间汇总</option></select></div></div>
  <div class="form-group"><label class="control-label col-xs-12 col-sm-2">文章</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[article_ids]" placeholder="已审核文章编号，逗号分隔"></div></div>
  <div class="form-group"><label class="control-label col-xs-12 col-sm-2">分组</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[group_name]" placeholder="可选分组名"></div></div>
  <div class="form-group"><label class="control-label col-xs-12 col-sm-2">状态</label><div class="col-xs-12 col-sm-8">
    <label class="radio-inline"><input type="radio" name="row[status]" value="0" checked> 草稿</label>
    <label class="radio-inline"><input type="radio" name="row[status]" value="1"> 发布</label>
  </div></div>
  <div class="layer-footer"><button type="submit" class="btn btn-primary">确定</button></div>
</form>
</div></div></div>
<script src="/vendor/jquery.js"></script>
<script src="/vendor/layui.js"></script>
<script src="/geo-api.js"></script>
<script src="/ai-config.js"></script>
<script src="/admin-runtime.js"></script>
</body>
</html>
