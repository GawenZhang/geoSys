<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>指令试写</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="/site-assets/user_assets/css/backend.css?v=1.3.1346" rel="stylesheet">
<link rel="stylesheet" href="/admin-runtime.css">
</head>
<body class="inside-header inside-aside" data-page-key="prompt_test" data-page-path="/user/prompt_test">
<div class="content"><div class="panel panel-default"><div class="panel-body">
<form class="form-horizontal">
  <div class="form-group"><label class="control-label col-xs-12 col-sm-2">标题</label><div class="col-xs-12 col-sm-8"><input class="form-control" name="row[title]" placeholder="试写标题"></div></div>
  <div class="form-group"><label class="control-label col-xs-12 col-sm-2">蒸馏词</label><div class="col-xs-12 col-sm-8"><select class="form-control" name="row[company_keyword_id]"><option value="0">不选择</option></select></div></div>
  <div class="form-group"><label class="control-label col-xs-12 col-sm-2">知识库</label><div class="col-xs-12 col-sm-8"><select class="form-control" name="row[huaxiang_id]"><option value="0">不选择</option></select></div></div>
  <div class="form-group"><label class="control-label col-xs-12 col-sm-2">正文指令</label><div class="col-xs-12 col-sm-8"><select class="form-control" name="row[zhiling_id]"><option value="0">不使用已存指令</option></select></div></div>
  <div class="form-group"><label class="control-label col-xs-12 col-sm-2">临时指令</label><div class="col-xs-12 col-sm-8"><textarea class="form-control" name="row[zhiling]" rows="4" placeholder="可直接写一段未保存的指令"></textarea></div></div>
  <div class="form-group"><div class="col-sm-offset-2 col-sm-8"><button type="submit" class="btn btn-primary">试写</button></div></div>
</form>
<div id="prompt-result" style="margin-top:16px"></div>
</div></div></div>
<script src="/vendor/jquery.js"></script>
<script src="/vendor/layui.js"></script>
<script src="/geo-api.js"></script>
<script src="/ai-config.js"></script>
<script src="/admin-runtime.js"></script>
</body>
</html>
