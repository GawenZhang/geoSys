# Included inside the existing port-80 server. No listen and no server_name.
location = /geo {
    return 301 /geo/;
}

location /geo/ {
    client_max_body_size 20m;
    proxy_pass http://127.0.0.1:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /geo;
    proxy_redirect off;
    proxy_read_timeout 120s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/html text/javascript application/javascript application/json image/svg+xml;
}
